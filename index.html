<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习吧！小精灵 - 图鉴大全</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="header-left">
                <h1>📖 小精灵图鉴</h1>
                <span class="version-badge">v3.0</span>
            </div>
            <div class="header-right">
                <span class="total-count" id="totalCount">加载中...</span>
                <button class="btn-admin" id="adminBtn" title="管理面板">⚙️</button>
            </div>
        </div>

        <div class="category-tabs" id="categoryTabs">
            <button class="category-tab active" data-category="pet">🧚 精灵</button>
            <button class="category-tab" data-category="item">🎒 道具</button>
            <button class="category-tab" data-category="skill">⚔️ 技能</button>
            <button class="category-tab" data-category="wear">👕 装备</button>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索名称、类型、描述...">
            <div class="filter-tabs" id="filterTabs"></div>
        </div>

        <div class="pokedex-grid" id="pokedexGrid"></div>

        <div class="status-bar">
            <span id="resultCount">共 0 项</span>
            <span id="dataStatus">📦 数据已持久化</span>
            <span id="syncStatus"></span>
            <span id="lastSyncTime"></span>
        </div>
    </div>

    <!-- ===== 详情弹窗 ===== -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-box" id="detailModalBox">
            <div class="modal-header">
                <h2 id="detailTitle">详情</h2>
                <button class="modal-close" id="detailCloseBtn">✕</button>
            </div>
            <div class="modal-body" id="detailBody"></div>
        </div>
    </div>

    <!-- ===== 管理面板弹窗 ===== -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-box" style="max-width: 720px;">
            <div class="modal-header">
                <h2>⚙️ 管理面板</h2>
                <button class="modal-close" id="adminCloseBtn">✕</button>
            </div>
            <div class="modal-body" id="adminBody"></div>
        </div>
    </div>

    <!-- ===== 编辑弹窗 ===== -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box" style="max-width: 580px;">
            <div class="modal-header">
                <h2 id="editTitle">编辑</h2>
                <button class="modal-close" id="editCloseBtn">✕</button>
            </div>
            <div class="modal-body" id="editBody"></div>
        </div>
    </div>

    <!-- ===== GitHub 配置弹窗 ===== -->
    <div class="modal-overlay" id="configModal">
        <div class="modal-box" style="max-width: 520px;">
            <div class="modal-header">
                <h2>☁️ GitHub 配置</h2>
                <button class="modal-close" id="configCloseBtn">✕</button>
            </div>
            <div class="modal-body" id="configBody">
                <form class="edit-form" onsubmit="saveGitHubConfig(event)">
                    <div class="form-group">
                        <label>GitHub 用户名</label>
                        <input name="owner" id="configOwner" placeholder="你的GitHub用户名" required>
                    </div>
                    <div class="form-group">
                        <label>数据仓库名</label>
                        <input name="repo" id="configRepo" placeholder="re_of_pokemon" required>
                    </div>
                    <div class="form-group">
                        <label>Token</label>
                        <input name="token" id="configToken" type="password" placeholder="github_pat_xxx" required>
                    </div>
                    <div style="font-size:12px;color:rgba(255,255,255,0.2);margin-bottom:10px;padding:8px 12px;background:rgba(255,215,0,0.05);border-radius:8px;border-left:3px solid #ffd700;">
                        🔒 Token 仅保存在你的浏览器本地，不会被上传
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-cancel" onclick="closeConfigModal()">取消</button>
                        <button type="submit" class="btn-save">保存配置</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/github-db.js"></script>
    <script src="js/pokedex.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
