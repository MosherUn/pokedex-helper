<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习吧！小精灵 - 图鉴大全</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">
        <!-- 头部 -->
        <div class="header">
            <div class="header-left">
                <h1>📖 小精灵图鉴</h1>
                <span class="version-badge">v3.0</span>
            </div>
            <div class="header-right">
                <span class="total-count" id="totalCount">加载中...</span>
                <button class="btn-admin" id="adminBtn" title="管理面板">⚙️</button>
            </div>
        </div>

        <!-- 分类切换 -->
        <div class="category-tabs" id="categoryTabs">
            <button class="category-tab active" data-category="pet">🧚 精灵</button>
            <button class="category-tab" data-category="item">🎒 道具</button>
            <button class="category-tab" data-category="skill">⚔️ 技能</button>
            <button class="category-tab" data-category="wear">👕 装备</button>
        </div>

        <!-- 搜索和筛选 -->
        <div class="search-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索名称、类型、描述...">
            <div class="filter-tabs" id="filterTabs"></div>
        </div>

        <!-- 图鉴网格 -->
        <div class="pokedex-grid" id="pokedexGrid"></div>

        <!-- 状态栏 -->
        <div class="status-bar">
            <span id="resultCount">共 0 项</span>
            <span id="dataStatus">📦 数据已持久化</span>
        </div>
    </div>

    <!-- ===== 详情弹窗 ===== -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-box" id="detailModalBox">
            <div class="modal-header">
                <h2 id="detailTitle">详情</h2>
                <button class="modal-close" id="detailCloseBtn">✕</button>
            </div>
            <div class="modal-body" id="detailBody"></div>
        </div>
    </div>

    <!-- ===== 管理面板弹窗 ===== -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-box" style="max-width: 700px;">
            <div class="modal-header">
                <h2>⚙️ 管理面板</h2>
                <button class="modal-close" id="adminCloseBtn">✕</button>
            </div>
            <div class="modal-body" id="adminBody"></div>
        </div>
    </div>

    <!-- ===== 编辑弹窗 ===== -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box" style="max-width: 580px;">
            <div class="modal-header">
                <h2 id="editTitle">编辑</h2>
                <button class="modal-close" id="editCloseBtn">✕</button>
            </div>
            <div class="modal-body" id="editBody"></div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/pokedex.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
